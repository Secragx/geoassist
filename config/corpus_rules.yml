version: 1
ignore:
  - "**/.git/**"
  - "**/_drafts/**"
  - "**/model_manuales.md"

apps:
  - match: "GEOINVENTARIOS"
    app: geoinventarios
    aliases: ["inventario", "inventarios", "inventary"]
  - match: "GEOPRICER"
    app: geopricer
    aliases: ["geoprice", "geopricer", "price", "pricer"]
  - match: "GEOPOS"
    app: geopos
    aliases: ["geoconsola", "consola", "pos"]
  - match: "GEOPROMOTION"
    app: geopromotion
    aliases: ["promocion", "promociones", "promo"]

status:
  - match: "VERSIONES POR APROBAR"
    status: pending
  - match: "VERSIONES APROBADAS"
    status: approved
  - match: "VERSIONES ANTERIORES"
    status: archived

defaults:
  app: unknown
  status: unknown
  on_unmatched: warn
